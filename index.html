<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Family Health Tracker</title>
<meta name="description" content="Family blood pressure log with photos, guidance, reminders and PDF reports.">
<meta name="theme-color" content="#0B6E69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Health">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true" class="logo"><path d="M16 27s-10-6.2-10-13.3A5.7 5.7 0 0 1 16 10a5.7 5.7 0 0 1 10 3.7C26 20.8 16 27 16 27z" fill="var(--accent)"/><path d="M7 16h5l2-4 3 8 2-4h6" fill="none" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Family Health</span>
    </div>
    <button class="icon-btn" id="btnGuide" aria-label="What the numbers mean">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></svg>
    </button>
  </header>

  <nav class="people" id="people" aria-label="Family members"></nav>

  <main id="views">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-history" hidden></section>
    <section class="view" id="view-family" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5V20h-5.5v-5h-5v5H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Today</span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>History</span></button>
    <button class="tab-add" id="tabAdd" aria-label="Add reading"><svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3V19H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13.3" r="3.3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button data-tab="family"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 19c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17" cy="9.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M16.5 13.9c2.4 0 4 1.4 4.5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Family</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>Settings</span></button>
  </nav>
</div>

<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="ocr.js"></script>
<script src="lab.js"></script>
<script src="monitor.js"></script>
<script src="lib/nacl-fast.min.js"></script>
<script src="scan.js"></script>
<script src="backup.js"></script>
<script src="i18n.js"></script>
<script src="watch.js"></script>
<script src="care.js"></script>
<script src="devices.js"></script>
<script src="condinfo.js"></script>
<script src="conditions.js"></script>
<script src="women.js"></script>
<script src="app.js"></script>
</body>
</html>
